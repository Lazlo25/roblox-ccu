name: Hourly CCU

on:
  schedule:
    - cron: '*/5 * * * *'  # GitHub drops most scheduled runs, so try every 5 minutes; collect.py records each hour once
  workflow_dispatch:       # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write          # lets the job commit data/ back to the repo

concurrency:
  group: hourly-ccu
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Collect CCU
        run: python3 collect.py

      # These hourly commits are also what keeps the schedule alive: GitHub disables scheduled
      # workflows after 60 days without repository activity.
      - name: Commit data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          git diff --cached --quiet && exit 0
          git commit -q -m "CCU $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 10; done
          exit 1
